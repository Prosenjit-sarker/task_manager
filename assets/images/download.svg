<!-- splash_task_manager.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Task Manager Icon">
  <!-- background rounded square with soft gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"></stop>
      <stop offset="1" stop-color="#06B6D4"></stop>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"></feGaussianBlur>
      <feOffset dx="0" dy="3" result="off"></feOffset>
      <feMerge>
        <feMergeNode in="off"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="6" y="6" width="108" height="108" rx="20" fill="url(#bgGrad)" filter="url(#softShadow)"></rect>

  <!-- clipboard body -->
  <g transform="translate(28,24)">
    <rect x="6" y="14" width="56" height="64" rx="6" fill="#ffffff" opacity="0.98"></rect>
    <!-- clipboard top tab -->
    <rect x="22" y="4" width="20" height="12" rx="3" fill="#ffffff" opacity="0.98"></rect>
    <!-- paper lines -->
    <g fill="#E6EEF1" opacity="0.95">
      <rect x="12" y="28" width="40" height="4" rx="2"></rect>
      <rect x="12" y="38" width="28" height="4" rx="2"></rect>
      <rect x="12" y="48" width="34" height="4" rx="2"></rect>
    </g>

    <!-- circular check badge -->
    <circle cx="50" cy="58" r="12" fill="#06B6D4"></circle>
    <!-- check mark -->
    <path d="M44 56.5 L48 60.5 L56 52.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
</svg>
